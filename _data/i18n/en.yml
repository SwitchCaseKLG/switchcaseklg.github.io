  heading: Services
  sub: Custom web apps, desktop tools and automation, built around the way you work.
  items:
    - icon: wrench
      title: Tools and Desktop Apps
      text: Repetitive tasks on the computer eating up your day? We automate them with software developed specifically for your workflow. Where it adds value, we build in machine learning using current technologies.
    - icon: laptop
      title: Websites and Web Apps
      text: Need a website of your own? We design and build it for you. Have special requirements or need specific functionality? We develop web apps exactly to your needs.
    - icon: lightbulb-o
      title: Consulting
      text: Not sure yet which solution fits? We look at your processes together with you, show you the different ways to get there and help you choose the right technology, for example when getting started with artificial intelligence.

