{% assign t = site.data.i18n[page.lang] %}
<head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }} – {{ t.meta.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ t.meta.description }}">
    <link rel="canonical" href="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
    {% if page.alt_url %}
    <link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
    <link rel="alternate" hreflang="{{ t.lang_switch.code }}" href="{{ page.alt_url | prepend: site.baseurl | prepend: site.url }}">
    {% endif %}

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ t.meta.title }}{% endif %}">
    <meta property="og:description" content="{{ t.meta.description }}">
    <meta property="og:url" content="{{ page.url | prepend: site.baseurl | prepend: site.url }}">
    <meta property="og:locale" content="{{ t.meta.locale }}">
    <meta name="twitter:card" content="summary">

    <link rel="shortcut icon" type="image/x-icon" href="{{ "/favicon.ico" | prepend: site.baseurl }}">

    <!-- Custom CSS & Bootstrap Core CSS - Uses Bootswatch Flatly Theme: http://bootswatch.com/flatly/ -->
    <link rel="stylesheet" href="{{ "/style.css" | prepend: site.baseurl }}">

    <!-- Icon Font -->
    <link rel="stylesheet" href="{{ "/css/font-awesome/css/font-awesome.min.css" | prepend: site.baseurl }}">
</head>
