{% assign t = site.data.i18n[page.lang] %}
<!-- Portfolio Grid Section -->
    <section id="portfolio" class="bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">{{ t.portfolio.heading }}</h2>
                    <h3 class="section-subheading text-muted">{{ t.portfolio.sub }}</h3>
                </div>
            </div>
            <div class="row row-centered">
            {% for project in site.data.projects %}
                {% assign p = project[page.lang] %}
                {% assign title = p.title | default: project.title %}
                <div class="col-md-4 col-sm-6 portfolio-item">
                    <a href="#portfolioModal-{{ project.id }}" class="portfolio-link" data-toggle="modal" aria-label="{{ t.portfolio.details }}: {{ title }}">
                        <div class="portfolio-hover">
                            <div class="portfolio-hover-content">
                                <i class="fa fa-plus fa-3x" aria-hidden="true"></i>
                            </div>
                        </div>
                        <img src="{{ "/img/portfolio/" | prepend: site.baseurl }}{{ project.thumbnail }}" class="img-responsive img-centered" alt="{{ project.alt }}" loading="lazy">
                    </a>
                    <div class="portfolio-caption">
                        <h4>{{ title }}</h4>
                        <p class="text-muted">{{ p.subtitle }}</p>
                    </div>
                </div>
            {% endfor %}
            </div>
        </div>
    </section>
