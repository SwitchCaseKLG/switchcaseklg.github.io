{% assign t = site.data.i18n[page.lang] %}
<!-- Team Section -->
    <section id="team">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">{{ t.team.heading }}</h2>
                    <h3 class="section-subheading text-muted">{{ t.team.sub }}</h3>
                </div>
            </div>
            <div class="row row-centered">
                {% for member in site.people %}
                <div class="col-sm-4">
                    <div class="team-member">
                        <img src="{{ "/img/team/" | prepend: site.baseurl }}{{ member.pic }}.jpg" class="img-responsive img-circle" alt="{{ member.name }}" loading="lazy">
                        <h4>{{ member.name }}</h4>
                        <p class="text-muted">{{ t.team.roles[member.key] }}</p>
                        <ul class="list-inline social-buttons">
                            {% for network in member.social %}
                            <li>
                                <a href="{{ network.url }}" target="_blank" rel="noopener" aria-label="{{ member.name }}: {{ t.team.social[network.title] | default: network.title }}">
                                    <i class="fa fa-{{ network.title }}" aria-hidden="true"></i>
                                </a>
                            </li>
                            {% endfor %}

                        </ul>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
