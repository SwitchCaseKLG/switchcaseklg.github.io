{% assign t = site.data.i18n[page.lang] %}
<!-- Services Section -->
    <section id="services">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">{{ t.services.heading }}</h2>
                    <h3 class="section-subheading text-muted">{{ t.services.sub }}</h3>
                </div>
            </div>
            <div class="row row-centered text-center">
                {% for service in t.services.items %}
                <div class="col-md-5 col-sm-6">
                    <div class="service-card">
                        <span class="fa-stack fa-4x" aria-hidden="true">
                            <i class="fa fa-circle fa-stack-2x text-primary"></i>
                            <i class="fa fa-{{ service.icon }} fa-stack-1x fa-inverse"></i>
                        </span>
                        <h4 class="service-heading">{{ service.title }}</h4>
                        <p class="text-muted">{{ service.text }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
