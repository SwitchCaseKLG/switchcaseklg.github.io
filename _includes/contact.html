{% assign t = site.data.i18n[page.lang] %}
<section id="contact">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">{{ t.contact.heading }}</h2>
                    <h3 class="section-subheading text-muted">{{ t.contact.sub }} <a href="mailto:{{ site.email }}">{{ site.email }}</a></h3>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-10 col-lg-offset-1">
                    <form name="sentMessage" id="contactForm" action="https://formspree.io/f/xleayanv" method="POST" data-success="{{ t.contact.success }}" data-error="{{ t.contact.error }}">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="name">{{ t.contact.name }}</label>
                                    <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
                                </div>
                                <div class="form-group">
                                    <label for="email">{{ t.contact.email }}</label>
                                    <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                                </div>
                                <div class="form-group">
                                    <label for="phone">{{ t.contact.phone }} <span class="text-muted">({{ t.contact.optional }})</span></label>
                                    <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="message">{{ t.contact.message }}</label>
                                    <textarea class="form-control" id="message" name="message" required></textarea>
                                </div>
                            </div>
                            <div class="clearfix"></div>
                            <div class="col-lg-12 text-center">
                                <div id="success" role="status" aria-live="polite"></div>
                                <button type="submit" class="btn btn-xl">{{ t.contact.send }}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
